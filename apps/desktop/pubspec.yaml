name: koncet
description: "KONCET deployment simulation workbench"
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_rust_bridge: ^2.13.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  fl_chart: ^1.3.1
  window_manager: ^0.7.1
  nativeapi: ^0.6.2
  intl: ^0.20.3
  koncet_ui:
    path: ../../packages/koncet_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/GPL-3.0-or-later.txt
    - assets/licenses/OFL-Inter.txt
    - assets/licenses/OFL-JetBrainsMono.txt
    - assets/licenses/THIRD_PARTY_NOTICES.md
