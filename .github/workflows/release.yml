name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev python3 curl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Verify version and clean tree
        run: |
          ./scripts/check-version.sh "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain)" || {
            echo "Refusing to release from a dirty tree." >&2
            exit 1
          }

      - name: Build release bundle and package artifacts
        run: |
          ./scripts/build-release.sh
          ./scripts/package-linux.sh
          cd dist && sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "KONCET ${GITHUB_REF_NAME#v}" \
            --generate-notes
