name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev xvfb python3 curl

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Cache developer tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-koncet-tools-just-1.59.0-frb-2.13.0
          restore-keys: |
            ${{ runner.os }}-koncet-tools-

      - name: Install repository tooling
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          command -v just >/dev/null 2>&1 || cargo install just --version 1.59.0 --locked
          command -v flutter_rust_bridge_codegen >/dev/null 2>&1 || \
            cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Bootstrap Rust and Dart dependencies
        run: just bootstrap

      - name: Check formatting, lint, and tests
        run: just check

      - name: Check generated bridge drift
        run: just codegen-check

      - name: Run Linux end-to-end journey
        run: xvfb-run -a just e2e
