[workspace]
members = [
    "crates/koncet-domain",
    "crates/koncet-sim",
    "crates/koncet-storage",
    "crates/koncet-app",
    "crates/koncet-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
